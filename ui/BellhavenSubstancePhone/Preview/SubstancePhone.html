);border-color:var(--mint);font-weight:750}.summary{padding:0 22px 13px;display:flex;justify-content:space-between;align-items:center;color:#8fa0b4;font-size:10px}.summary strong{color:#cddae8;font-weight:650}.cards{flex:1;overflow-y:auto;padding:0 19px 18px;scrollbar-color:#394759 transparent;scrollbar-width:thin}.section-heading{display:flex;align-items:center;gap:9px;margin:18px 3px 10px}.section-heading:first-child{margin-top:4px}.section-heading .label{font-size:10px;letter-spacing:1.4px;font-weight:750;color:#b4c4d7;text-transform:uppercase}.section-heading .rule{height:1px;flex:1;background:var(--line)}.section-heading .count{font-size:10px;color:#71849a}.item{border:1px solid rgba(173,192,219,.12);background:linear-gradient(115deg,#172231,#141d2a);border-radius:14px;display:flex;align-items:center;padding:13px 11px;margin-bottom:8px;gap:12px;min-height:75px;user-select:none;transition:border-color .15s,background .15s}.item:hover,.item:focus{outline:none;border-color:#8d7bca;background:#1c2738}.emblem{flex:0 0 43px;height:43px;border-radius:12px;background:#273248;display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--purple);border:1px solid #35435c}.emblem.o{color:#e4b1c1;background:#392936}.emblem.b{color:#9dc4f8;background:#233448}.emblem.s{color:#eccf89;background:#3b3528}.emblem.d{color:#bba9f8;background:#302a43}.info{flex:1;min-width:0}.info h3{font-size:13px;margin:0 0 5px;font-weight:750}.info p{font-size:10px;color:#8295ab;margin:0;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.tag{flex-shrink:0;font-size:9px;padding:5px 6px;border-radius:6px;border:1px solid #2d574c;background:#1b3533;color:#b1f1d7}.tag.unknown{color:#eacda1;background:#393024;border-color:#5d4a2f}.arrow{color:#8492a7;font-size:17px;margin-left:3px}.bottom-nav{height:65px;flex:0 0 65px;background:#0d1520;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding:3px 13px}.nav{border:0;background:none;color:#6d8094;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:58px;font-size:10px}.nav .nav-icon{font-size:19px;line-height:21px}.nav.active{color:var(--mint)}.hint{font-size:10px;color:#a2b2c6;text-align:center;padding:8px 0 5px;background:#101924;border-top:1px solid #293546}.tooltip{z-index:30;position:absolute;pointer-events:none;width:270px;background:#202d3f;border:1px solid #61718a;border-radius:13px;padding:13px;box-shadow:0 15px 40px #000c;display:none}.tooltip.show{display:block}.tip-title{font-size:13px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}.tip-line{color:#bccbdc;font-size:11px;margin:5px 0}.tip-muted{color:#8ea0b4;font-size:10px;line-height:1.5}.tip-foot{border-top:1px solid #4a5b70;padding-top:9px;margin-top:9px;font-size:10px;color:var(--mint)}.overlay{z-index:80;position:absolute;inset:0;background:rgba(3,8,13,.82);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(5px)}.overlay.show{display:flex}.detail{width:100%;height:90%;display:flex;flex-direction:column;background:#101923;border:1px solid #415167;border-radius:24px 24px 0 0;overflow:hidden;box-shadow:0 -10px 50px #000b}.detail-head{padding:21px 20px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start}.detail-name{font-size:22px;font-weight:800;margin:6px 0}.detail-content{overflow:auto;padding:15px 20px 30px;line-height:1.55}.detail-label{font-size:10px;letter-spacing:1.4px;color:var(--mint);font-weight:750;text-transform:uppercase;margin:19px 0 9px}.kv{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding:11px 0}.kv .key{color:#8d9eb3}.kv .value{text-align:right;color:#e1eaf6;font-weight:650}.note{background:#1b2837;color:#aebfd3;border:1px solid #2b3a4d;padding:11px 12px;border-radius:10px;font-size:11px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #42536a;background:#243247;border-radius:8px;padding:7px 9px;font-size:10px;color:#d3ddeb}.chip.off{opacity:.42;text-decoration:line-through}.empty{padding:40px 20px;text-align:center;color:#9dafc2}.empty b{color:white;display:block;margin-bottom:7px}.footer{color:#6a7c92;font-size:10px;padding-top:17px}.nav-info{padding:28px 23px;color:#a5b5c9;line-height:1.7}.nav-info h3{color:white}.nav-info button{background:var(--mint);color:#13212b;border:0;border-radius:9px;padding:10px 15px;font-weight:800}.mobile-backdrop{background:#090e16}.more{color:#c9d5e5;background:#273648;border:1px solid #4b5e75;border-radius:8px;padding:7px 11px}.mini-status{display:flex;gap:7px;align-items:center;color:#a9becf;font-size:10px}.mini-dot{width:6px;height:6px;background:#74e7bc;border-radius:50%}
@media(max-width:440px){body{padding:0}.shell{height:100dvh;width:100vw;min-height:0;border:0;border-radius:0}.tooltip{width:min(270px,calc(100vw - 22px))}}
</style>

<body>
<div class="shell" id="shell">
  <div class="status"><span>09:41 <span style="opacity:.6">BELLHAVEN LTE</span></span><i>▂▄▆  ◕  ▰</i></div>
  <header class="app-header"><div><div class="eyebrow">FIELD INTELLIGENCE</div><div class="app-title">Substance Index<span style="color:var(--mint)">.</span></div><div class="app-subtitle">Know what you're carrying. Or what you think you know.</div></div><button class="icon-button" aria-label="Information" id="infoButton">ⓘ</button></header>
  <div class="search-area"><div class="search"><span>⌕</span><input id="search" autocomplete="off" placeholder="Search substances, aliases, or classes..." aria-label="Search substances"></div></div>
  <div class="tab-row" id="tabs" role="tablist"></div>
  <div class="summary"><span id="count">—</span><span><strong>Hover</strong> quick look · <strong>Right-click</strong> details</span></div>
  <main class="cards" id="cards"></main>
  <div class="hint">Information reflects your character's knowledge, not hidden truth.</div>
  <nav class="bottom-nav"><button class="nav active" data-page="index"><span class="nav-icon">▦</span>Index</button><button class="nav" data-page="saved"><span class="nav-icon">♡</span>Saved</button><button class="nav" data-page="testing"><span class="nav-icon">⌁</span>Testing</button><button class="nav" data-page="about"><span class="nav-icon">☰</span>About</button></nav>
  <div class="tooltip" id="tooltip" role="tooltip"></div>
  <div class="overlay" id="overlay"><div class="detail" role="dialog" aria-modal="true" aria-label="Substance details"><div class="detail-head"><div><div class="eyebrow" id="detailClass">CLASS</div><div class="detail-name" id="detailName">Item</div><span class="mini-status"><span class="mini-dot"></span><span id="detailVerified">Claimed identification</span></span></div><button class="icon-button" id="closeDetails" aria-label="Close details">×</button></div><div class="detail-content" id="detailContent"></div></div></div>
</div>
<!-- BELLHAVEN_BOOTSTRAP -->
<script>
(()=>{'use strict';
const CLASSES=['All Classes','Opioids','Benzodiazepines','Stimulants','Dissociatives'];
const ICONS={'Opioids':'◈','Benzodiazepines':'⊞','Stimulants':'ϟ','Dissociatives':'◉'};
const COLORS={'Opioids':'o','Benzodiazepines':'b','Stimulants':'s','Dissociatives':'d'};
let currentClass='All Classes',searchText='',page='index';
let saved=new Set(),substances=[];
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const demonstration=[
{id:'morphine',name:'Morphine',drugClass:'Opioids',verified:true,claimedAs:'Morphine',potency:'Reference',reference:'Morphine',description:'Reference compound used for the opioid game-strength index.',onset:'Route-dependent',effects:'Pain response, sedation, awareness',risks:'Respiratory impairment, sedation and dependence',composition:'Morphine (verified game sample)',routes:['Oral','IV'],knowledge:'Lab-confirmed in-game identification'},
{id:'hydromorphone',name:'Hydromorphone',drugClass:'Opioids',verified:true,claimedAs:'Dilaudid',potency:'High',reference:'Morphine',description:'A potent opioid with distinct oral and injectable gameplay profiles.',onset:'Drug and route specific',effects:'Pain response, sedation, coordination',risks:'Respiratory impairment and loss of consciousness',composition:'Hydromorphone (verified game sample)',routes:['Oral','IV'],knowledge:'Character has confirmed composition'},
{id:'oxycodone',name:'Oxycodone',drugClass:'Opioids',verified:true,claimedAs:'Oxy',potency:'Moderate–High',reference:'Morphine',description:'Prescription opioid; effect and tolerance curves vary by formulation.',onset:'Formulation dependent',effects:'Pain response, composure, sedation',risks:'Respiratory depression; dependence',composition:'Oxycodone (verified game sample)',routes:['Oral'],knowledge:'Verified in-game sample'},
{id:'street-h',name:'Street H',drugClass:'Opioids',verified:false,claimedAs:'Heroin',potency:'Unknown',reference:'Morphine',description:'Street product. Reported name and actual contents may differ.',onset:'Unknown',effects:'Perceived analgesia and sedation',risks:'Unknown composition; potential opioid toxicity',composition:'Not tested',routes:[],knowledge:'Only the seller\'s claim is known'},
{id:'alprazolam',name:'Alprazolam',drugClass:'Benzodiazepines',verified:true,claimedAs:'Xanax',potency:'Reference',reference:'Alprazolam',description:'Reference compound for the benzodiazepine game-strength index.',onset:'Route/formulation dependent',effects:'Composure, sedation, memory, coordination',risks:'Blackouts, impairment, dependence; interactions with other depressants',composition:'Alprazolam (verified game sample)',routes:['Oral'],knowledge:'Verified in-game sample'},
{id:'diazepam',name:'Diazepam',drugClass:'Benzodiazepines',verified:true,claimedAs:'Valium',potency:'Distinct profile',reference:'Alprazolam',description:'Benzodiazepine with its own onset and extended decay profile.',onset:'Gradual',effects:'Sedation, composure, motor coordination',risks:'Impairment, tolerance, dependence and interactions',composition:'Diazepam (verified game sample)',routes:['Oral'],knowledge:'Verified in-game sample'},
{id:'pressed-bar',name:'Pressed Bar',drugClass:'Benzodiazepines',verified:false,claimedAs:'Alprazolam',potency:'Unknown',reference:'Alprazolam',description:'Street tablet with unconfirmed contents.',onset:'Unknown',effects:'Effects not verified',risks:'Contents, strength and interactions are unverified',composition:'Not tested',routes:[],knowledge:'Unverified seller description'},
{id:'cocaine',name:'Cocaine',drugClass:'Stimulants',verified:true,claimedAs:'Cocaine',potency:'High stimulation',reference:'Stimulant index',description:'A stimulant with a relatively sharp game-effect curve.',onset:'Route-dependent',effects:'Alertness, stimulation, composure variability',risks:'Cardiovascular strain, anxiety, impaired judgement',composition:'Cocaine (verified game sample)',routes:['Intranasal','Smoking'],knowledge:'Verified in-game sample'},
{id:'methamphetamine',name:'Methamphetamine',drugClass:'Stimulants',verified:true,claimedAs:'Meth',potency:'High stimulation',reference:'Stimulant index',description:'A stimulant with a distinct, longer-lasting game-effect profile.',onset:'Route-dependent',effects:'Alertness, stamina perception, awareness',risks:'Sleep deprivation, distress and cardiovascular strain',composition:'Methamphetamine (verified game sample)',routes:['Oral','Intranasal','Smoking'],knowledge:'Verified in-game sample'},
{id:'ecstasy',name:'Street E Pill',drugClass:'Stimulants',verified:false,claimedAs:'MDMA',potency:'Unknown',reference:'Stimulant index',description:'Unverified pill; character memories reflect perceived contents, not hidden composition.',onset:'Unknown',effects:'Not confirmed',risks:'Unknown composition, impairment and overheating',composition:'Not tested',routes:[],knowledge:'The character knows the seller\'s claim, not the chemistry'},
{id:'ketamine',name:'Ketamine',drugClass:'Dissociatives',verified:true,claimedAs:'Ketamine',potency:'Dissociative',reference:'Dissociative index',description:'Effects on coordination and perception have their own curve.',onset:'Route-dependent',effects:'Altered perception, coordination and awareness',risks:'Disorientation and loss of control',composition:'Ketamine (verified game sample)',routes:['Intranasal'],knowledge:'Verified in-game sample'},
{id:'pcp',name:'PCP',drugClass:'Dissociatives',verified:true,claimedAs:'PCP',potency:'Dissociative',reference:'Dissociative index',description:'Distinct dissociative profile with potentially severe perception and motor impairment.',onset:'Route-dependent',effects:'Altered sensory perception, motor control, composure',risks:'Confusion, dangerous impairment and medical complications',composition:'PCP (verified game sample)',routes:['Smoking'],knowledge:'Verified in-game sample'}
];
substances=Array.isArray(window.__BellhavenPhoneBootCatalog)?window.__BellhavenPhoneBootCatalog.map(normalize):demonstration;
currentClass=CLASSES.includes(window.__BellhavenPhoneBootClass)?window.__BellhavenPhoneBootClass:'All Classes';
function normalize(x,i){return {id:String(x.id??`item-${i}`),name:String(x.name??'Unnamed'),drugClass:CLASSES.includes(x.drugClass)?x.drugClass:'Other',verified:!!x.verified,claimedAs:String(x.claimedAs??'Unknown'),potency:String(x.potency??'Unknown'),reference:String(x.reference??'Unknown'),description:String(x.description??''),onset:String(x.onset??'Unknown'),effects:String(x.effects??'Unknown'),risks:String(x.risks??'Not established'),composition:String(x.composition??'Not tested'),knowledge:String(x.knowledge??'No additional information'),routes:Array.isArray(x.routes)?x.routes.map(String):[]};}
function sortedList(list){return [...list].sort((a,b)=>(CLASSES.indexOf(a.drugClass)<0?99:CLASSES.indexOf(a.drugClass))-(CLASSES.indexOf(b.drugClass)<0?99:CLASSES.indexOf(b.drugClass))||a.name.localeCompare(b.name));}
function renderTabs(){ $('tabs').innerHTML=CLASSES.map(c=>`<button class="tab ${currentClass===c?'active':''}" data-class="${escapeHTML(c)}" role="tab" aria-selected="${currentClass===c}">${escapeHTML(c)}</button>`).join(''); $('tabs').querySelectorAll('[data-class]').forEach(b=>b.addEventListener('click',()=>{currentClass=b.dataset.class;hideTip();render();}));}
function itemMarkup(s){return `<article class="item" tabindex="0" role="button" aria-label="${escapeHTML(s.name)}. Right click for details" data-id="${escapeHTML(s.id)}"><div class="emblem ${COLORS[s.drugClass]||'d'}">${ICONS[s.drugClass]||'◈'}</div><div class="info"><h3>${escapeHTML(s.name)}</h3><p>${escapeHTML(s.verified?'Verified':'Claimed')}&nbsp; · &nbsp;${escapeHTML(s.potency)}&nbsp; · &nbsp;${escapeHTML(s.reference)}</p></div><span class="tag ${s.verified?'':'unknown'}">${s.verified?'TESTED':'UNTESTED'}</span><span class="arrow">›</span></article>`;}
function renderList(){let list=sortedList(substances).filter(s=>(currentClass==='All Classes'||currentClass===s.drugClass)&&(!searchText||`${s.name} ${s.claimedAs} ${s.drugClass} ${s.reference}`.toLowerCase().includes(searchText)));if(page==='saved')list=list.filter(s=>saved.has(s.id));$('count').textContent=`${list.length} ${list.length===1?'record':'records'} · Sorted by class`;
if(!list.length){$('cards').innerHTML='<div class="empty"><b>No matching records</b>Try another class or search term.</div>';return;}
const groups=[...new Set(list.map(x=>x.drugClass))];$('cards').innerHTML=groups.map(g=>`<div class="section-heading"><span class="label">${escapeHTML(g)}</span><span class="rule"></span><span class="count">${list.filter(s=>s.drugClass===g).length}</span></div>${list.filter(s=>s.drugClass===g).map(itemMarkup).join('')}`).join('');
$('cards').querySelectorAll('.item').forEach(row=>{const s=substances.find(x=>x.id===row.dataset.id);if(!s)return;row.addEventListener('mouseenter',()=>showTip(row,s));row.addEventListener('mouseleave',hideTip);row.addEventListener('focus',()=>showTip(row,s));row.addEventListener('blur',hideTip);row.addEventListener('contextmenu',e=>{e.preventDefault();openDetail(s)});row.addEventListener('click',()=>openDetail(s));row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(s)}})});
}
function showTip(row,s){const tp=$('tooltip');tp.innerHTML=`<div class="tip-title"><span>${escapeHTML(s.name)}</span><span class="tag ${s.verified?'':'unknown'}">${s.verified?'TESTED':'UNTESTED'}</span></div><div class="tip-line">${escapeHTML(s.drugClass)} · ${escapeHTML(s.potency)}</div><div class="tip-muted">${escapeHTML(s.description)}</div><div class="tip-foot">Right-click for complete details ↗</div>`;tp.classList.add('show');const container=$('shell').getBoundingClientRect(),r=row.getBoundingClientRect();const height=tp.getBoundingClientRect().height;let y=r.bottom-container.top+5;if(y+height>container.height-75)y=r.top-container.top-height-7;tp.style.left=Math.min(Math.max(10,r.left-container.left+45),container.width-280)+'px';tp.style.top=Math.max(38,y)+'px';}
function hideTip(){$('tooltip').classList.remove('show')}
function openDetail(s){hideTip();$('detailName').textContent=s.name;$('detailClass').textContent=s.drugClass;$('detailVerified').textContent=s.verified?'Verified in-game sample':'Unverified — claimed identity only';$('detailContent').innerHTML=`<div class="note">${escapeHTML(s.description)}</div><div class="detail-label">Identification</div>${kv('Claimed as',s.claimedAs)}${kv('Actual composition',s.composition)}${kv('Knowledge status',s.verified?'Tested':'Unknown')}${kv('Game potency',s.potency)}${kv('Family reference',s.reference)}<div class="detail-label">Effect profile</div>${kv('Onset',s.onset)}${kv('Known effects',s.effects)}<div class="detail-label">Known routes</div><div class="chips">${(s.routes.length?s.routes:['Unknown / Not verified']).map(x=>`<span class="chip">${escapeHTML(x)}</span>`).join('')}</div><div class="detail-label">Risk and uncertainty</div><div class="note">${escapeHTML(s.risks)}<br><br>${escapeHTML(s.knowledge)}</div><div class="footer">Relative potency is a fictional game index, not a real-world dose equivalence or overdose predictor.</div><div style="padding-top:20px"><button class="more" id="saveEntry">${saved.has(s.id)?'♥ Remove from saved':'♡ Save record'}</button></div>`;
$('overlay').classList.add('show');$('saveEntry').onclick=()=>{saved.has(s.id)?saved.delete(s.id):saved.add(s.id);openDetail(s);};}
function kv(a,b){return `<div class="kv"><span class="key">${escapeHTML(a)}</span><span class="value">${escapeHTML(b)}</span></div>`;}
function render(){renderTabs();if(page==='index'||page==='saved')renderList();else{$('count').textContent=page==='testing'?'Verification services':'App information';$('cards').innerHTML=page==='testing'?'<div class="nav-info"><h3>Sample Testing</h3><p>Lab confirmations and sample reports can update which details the character actually knows. Unverified names and claimed potency are not guaranteed accurate.</p><p>Connect your in-game testing system through the Unreal data bridge to unlock real game data.</p><button id="goIndex">View Index</button></div>':'<div class="nav-info"><h3>Substance Index</h3><p>This is a fictional in-game reference app. The catalogue separates verified information from claims, learned experiences and unknown composition.</p><p>All Classes appears first and sorts all records by class. Hover shows a box; right-click or tap opens detailed records.</p><button id="goIndex">View Index</button></div>';$('goIndex').onclick=()=>switchPage('index');}}
function switchPage(p){page=p;hideTip();document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===p));render();}
$('search').addEventListener('input',e=>{searchText=e.target.value.trim().toLowerCase();renderList();});$('closeDetails').onclick=()=>$('overlay').classList.remove('show');$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))$('overlay').classList.remove('show');});$('infoButton').onclick=()=>switchPage('about');document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>switchPage(b.dataset.page));document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('overlay').classList.remove('show');hideTip();}});
window.BellhavenPhone={setCatalog(items){if(!Array.isArray(items))return false;substances=items.map(normalize);currentClass='All Classes';render();return true;},setClass(name){currentClass=CLASSES.includes(name)?name:'All Classes';render();},getCatalog(){return substances.map(x=>({...x}));},resetDemo(){substances=demonstration;render();}};
render();
})();
</script>
